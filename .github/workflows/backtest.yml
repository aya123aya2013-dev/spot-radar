name: backtest
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lab-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Load state branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for i in 1 2 3 4; do git clone -q --branch data --single-branch --depth 1 "$URL" data && break; rm -rf data; sleep $((i*15)); done
          if [ ! -d data ]; then
            rc=0; git ls-remote --exit-code --heads "$URL" data > /dev/null || rc=$?
            if [ "$rc" != "2" ]; then echo "state branch not readable (rc=$rc): stop, never start from an empty account"; exit 1; fi
            mkdir data && git -C data init -q -b data && git -C data remote add origin "$URL"
          fi
      - name: OKX vs Binance candle comparison (the agent's coins)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python okx_candles.py || true
      - name: Backtest the agent (G) since 2019
        run: SPOT_LAB_DATA="$PWD/data/lab_data" timeout 1500 python agent.py backtest || true
      - name: Research round (pre-registered candidates against the live strategy)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" timeout 3000 python agent.py research || true
      - name: Apply the research verdict (mechanical; only what the pre-registered rule adopted)
        run: |
          SPOT_LAB_DATA="$PWD/data/lab_data" python apply_research.py || true
          if ! git diff --quiet -- strategy.json control.json candidates.json changelog.json docs/DECISIONS.md; then
            git config user.name "spot-radar-research"
            git config user.email "actions@users.noreply.github.com"
            git add strategy.json control.json candidates.json changelog.json docs/DECISIONS.md
            git commit -q -m "Research rule adopted a change (lab_data/research_G.json)"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
          fi
      - name: Agent on noise (yardstick)
        run: |
          mkdir -p "$RUNNER_TEMP/gnull"
          SPOT_LAB_DATA="$RUNNER_TEMP/gnull" timeout 900 python agent.py backtest --synthetic || true
          cp "$RUNNER_TEMP/gnull/backtest_G_null.json" data/lab_data/ 2>/dev/null || true
          SPOT_LAB_DATA="$RUNNER_TEMP/gnull" timeout 900 python agent.py research --synthetic || true
          cp "$RUNNER_TEMP/gnull/research_G_null.json" data/lab_data/ 2>/dev/null || true
      - name: Save state (single commit, no history growth)
        run: |
          cd data
          git config user.name github-actions && git config user.email actions@github.com
          git add -A
          git commit -q --amend -m "state" 2>/dev/null || git commit -q -m "state"
          ok=0; for i in 1 2 3 4; do if git push -q -f origin data; then ok=1; break; fi; echo "push failed (GitHub error), retry $i"; sleep $((i*15)); done; [ $ok = 1 ]
