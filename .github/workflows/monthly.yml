name: monthly-scorecard
on:
  schedule:
    - cron: "41 4 17 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lab-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Load state branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          for i in 1 2 3 4; do git clone -q --branch data --single-branch --depth 1 "$URL" data && break; rm -rf data; sleep $((i*15)); done
          if [ ! -d data ]; then
            rc=0; git ls-remote --exit-code --heads "$URL" data > /dev/null || rc=$?
            if [ "$rc" != "2" ]; then echo "state branch not readable (rc=$rc): stop, never start from an empty account"; exit 1; fi
            mkdir data && git -C data init -q -b data && git -C data remote add origin "$URL"
          fi
      - name: Monthly scorecard (read-only)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python monthly.py
      - name: Save state
        run: |
          cd data
          git config user.name github-actions && git config user.email actions@github.com
          git add -A
          git commit -q --amend -m "state" 2>/dev/null || git commit -q -m "state"
          ok=0; for i in 1 2 3 4; do if git push -q -f origin data; then ok=1; break; fi; echo "push failed (GitHub error), retry $i"; sleep $((i*15)); done; [ $ok = 1 ]
