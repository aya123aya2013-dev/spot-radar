name: paper-trade
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: send a Telegram test message
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: lab-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Load state branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone --branch data --single-branch --depth 1 "$URL" data 2>/dev/null || { mkdir data && git -C data init -q -b data && git -C data remote add origin "$URL"; }
      - name: One paper-trading cycle
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python spot_lab.py paper --once
      - name: Account D (daily quick-strike session, paper)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python scalp.py || true
      - name: Account E (take 2% and leave, profit protection, paper)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python strike.py || true
      - name: Account F (swing on weekly/daily with 4h confirmation, paper)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python swing.py || true
      - name: Daily lessons from closed trades (read-only)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python lessons.py || true
      - name: Telegram alerts (does nothing until the two secrets exist)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_TEST: ${{ github.event.inputs.telegram_test }}
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python notify.py || true
      - name: Post-mortem of closed trades (read-only)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python postmortem.py || true
      - name: OKX vs Binance public check
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python okx_check.py || true
      - name: Save state (single commit, no history growth)
        run: |
          cd data
          git config user.name github-actions && git config user.email actions@github.com
          git add -A
          git commit -q --amend -m "state" 2>/dev/null || git commit -q -m "state"
          git push -q -f origin data
