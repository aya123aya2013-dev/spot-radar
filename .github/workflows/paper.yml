name: paper-trade
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: send a Telegram test message
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: lab-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Load state branch
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git clone --branch data --single-branch --depth 1 "$URL" data 2>/dev/null || { mkdir data && git -C data init -q -b data && git -C data remote add origin "$URL"; }
      - name: The trading agent G (paper, run as if it were real money)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python agent.py || true
      - name: Daily lessons from closed trades (read-only)
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python lessons.py || true
      - name: Telegram alerts (does nothing until the two secrets exist)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_TEST: ${{ github.event.inputs.telegram_test }}
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python notify.py || true
      - name: OKX vs Binance public check
        run: SPOT_LAB_DATA="$PWD/data/lab_data" python okx_check.py || true
      - name: Remove files of the deleted accounts A-F (backup kept on branch archive-legacy)
        run: |
          cd data/lab_data 2>/dev/null || exit 0
          rm -f paper.json paper_[A-F].json paper_equity.csv paper_equity_[A-F].csv paper_trades.csv paper_trades_C.csv \
                config.json config_B.json config_C.json backtest.json backtest_[D-F].json research_C.json research_null.json \
                hitrate_C.json hitrate_null.json experiments.json experiments_null.json bear_hunt.json bear_hunt_null.json postmortems.json
      - name: Save state (single commit, no history growth)
        run: |
          cd data
          git config user.name github-actions && git config user.email actions@github.com
          git add -A
          git commit -q --amend -m "state" 2>/dev/null || git commit -q -m "state"
          git push -q -f origin data
