name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install pytest
        run: pip install -q pytest
      - name: Risk invariants, journal integrity, agent bookkeeping (synthetic data, no network trading)
        run: python -m pytest -q tests
